      <stop offset="0" stop-color="#bfe3ff" stop-opacity="0.75"/>
      <stop offset="0.6" stop-color="#5aa8ff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#5aa8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dff3ff"/>
      <stop offset="1" stop-color="#5fa9f5"/>
