    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5a3b8f" stop-opacity=".9"/>
      <stop offset="1" stop-color="#1a1530" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#c)">
