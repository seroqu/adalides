    <circle cx="256" cy="360" r="118" fill="#1a1530" stroke="#d9b45a" stroke-width="5"/>
    <circle cx="256" cy="360" r="100" fill="none" stroke="#d9b45a" stroke-width="1.5" opacity=".7"/>
    <path d="M150 360 Q256 265 362 360 Q256 455 150 360 Z" fill="#2f2460" stroke="#f1d58a" stroke-width="4"/>
    <circle cx="256" cy="360" r="40" fill="#d9b45a"/>
    <circle cx="256" cy="360" r="22" fill="#1a1530"/>
    <circle cx="268" cy="348" r="7" fill="#fff4cc"/>
